<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ===== Design Tokens ===== */
:root {
  /* Surfaces — warm navy tinted */
  --bg-base: #0f1218;
  --bg-surface: #161b25;
  --bg-elevated: #1c2230;
  --bg-hover: #232a3a;

  /* Borders */
  --border-subtle: #252d3f;
  --border-default: #2e3750;

  /* Typography */
  --text-primary: #e6e2dc;
  --text-secondary: #7e8594;
  --text-tertiary: #515868;

  /* Semantic */
  --positive: #3bb888;
  --positive-dim: rgba(59,184,136,0.1);
  --negative: #d9566b;
  --negative-dim: rgba(217,86,107,0.1);
  --accent: #c9983e;
  --accent-dim: rgba(201,152,62,0.1);
  --info: #6889c6;
  --info-dim: rgba(104,137,198,0.1);

  /* Spacing — 4pt base */
  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 16px;
  --sp-lg: 24px;
  --sp-xl: 32px;
  --sp-2xl: 48px;

  /* Radius */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;

  /* Font */
  --font: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
}

/* ===== Reset ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* ===== Header ===== */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: var(--sp-md) var(--sp-lg);
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-surface);
}
.header h1 {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 2.5px;
  text-transform: uppercase;
}
.header .right { display: flex; align-items: center; gap: var(--sp-md); }
.header .time { color: var(--text-tertiary); font-size: 0.78rem; font-variant-numeric: tabular-nums; }
.header .logout {
  color: var(--text-tertiary);
  text-decoration: none;
  font-size: 0.78rem;
  transition: color 0.15s;
}
.header .logout:hover { color: var(--negative); }
.header .status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--positive);
  flex-shrink: 0;
}
.header .status-dot.off { background: var(--negative); }

/* ===== Tabs ===== */
.tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  padding: 0 var(--sp-lg);
  overflow-x: auto;
}
.tab {
  padding: 12px 22px;
  cursor: pointer;
  color: var(--text-tertiary);
  font-size: 0.82rem;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
  user-select: none;
}
.tab:hover { color: var(--text-secondary); }
.tab.active {
  color: var(--text-primary);
  border-bottom-color: var(--accent);
}

/* ===== Content ===== */
.content { padding: var(--sp-lg); max-width: 1400px; margin: 0 auto; }
.panel { display: none; }
.panel.active { display: block; animation: fadeIn 0.2s ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ===== Summary Cards ===== */
.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: var(--sp-md);
  margin-bottom: var(--sp-lg);
}
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--sp-md) 20px;
}
.card .label {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 6px;
}
.card .value {
  font-size: 1.3rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.card .value.plus { color: var(--positive); }
.card .value.minus { color: var(--negative); }

/* ===== Tables ===== */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-surface);
  border-radius: var(--radius-md);
  overflow: hidden;
}
th {
  background: var(--bg-elevated);
  color: var(--text-tertiary);
  font-weight: 600;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  text-align: left;
  padding: 10px 14px;
}
td {
  padding: 10px 14px;
  border-top: 1px solid var(--border-subtle);
  font-size: 0.84rem;
  font-variant-numeric: tabular-nums;
}
tr:hover td { background: var(--bg-elevated); }

/* ===== Badges ===== */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.badge-l0 { background: rgba(81,88,104,0.2); color: var(--text-tertiary); }
.badge-l1 { background: var(--info-dim); color: var(--info); }
.badge-l2 { background: var(--positive-dim); color: var(--positive); }
.badge-l3 { background: var(--accent-dim); color: var(--accent); }

.profit-plus { color: var(--positive); }
.profit-minus { color: var(--negative); }

/* ===== Charts ===== */
.chart-container {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 20px;
  margin-bottom: var(--sp-md);
}
.chart-container canvas { max-height: 300px; }

/* ===== Section Divider ===== */
.section-divider {
  border: none;
  border-top: 1px solid var(--border-subtle);
  margin: var(--sp-xl) 0 var(--sp-lg);
}

/* ===== Theme Cards ===== */
.theme-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: var(--sp-md);
  margin-bottom: var(--sp-lg);
}
.theme-grid.active-grid {
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: var(--sp-md);
}
.theme-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: var(--sp-md);
  transition: border-color 0.15s;
}
.theme-card.active {
  background: var(--bg-elevated);
  border-color: var(--border-default);
  border-left: 3px solid var(--accent);
}
.theme-card.active .name { color: var(--text-primary); }
.theme-card.active .score { color: var(--accent); }
.theme-card.candidate { opacity: 0.75; }
.theme-card .name {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: var(--sp-sm);
}
.theme-card .score {
  font-size: 1.6rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.theme-card .meta {
  font-size: 0.72rem;
  color: var(--text-tertiary);
  margin-top: 6px;
}
.theme-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 0.6rem;
  font-weight: 700;
  margin-left: 6px;
  vertical-align: middle;
  letter-spacing: 0.3px;
}
.theme-badge.badge-active {
  background: var(--accent-dim);
  color: var(--accent);
}
.theme-badge.badge-candidate {
  background: rgba(81,88,104,0.15);
  color: var(--text-tertiary);
}
.active-header {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  margin: 0 0 var(--sp-md);
}
.active-header h3 {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-primary);
}
.active-header .next-eval {
  font-size: 0.72rem;
  color: var(--text-tertiary);
}

/* ===== Section Heading ===== */
.section-heading {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-tertiary);
  margin: var(--sp-md) 0 var(--sp-md);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ===== News ===== */
.news-item {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 14px var(--sp-md);
  margin-bottom: var(--sp-sm);
  transition: border-color 0.15s;
}
.news-item:hover { border-color: var(--border-default); }
.news-item .title { font-weight: 600; margin-bottom: var(--sp-xs); }
.news-item .title a { color: var(--text-primary); text-decoration: none; transition: color 0.15s; }
.news-item .title a:hover { color: var(--accent); }
.news-item .meta { font-size: 0.72rem; color: var(--text-tertiary); }

/* ===== System ===== */
.sys-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-md); }
.error-log {
  background: var(--bg-surface);
  border: 1px solid rgba(217,86,107,0.15);
  border-radius: var(--radius-sm);
  padding: var(--sp-md);
  font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
  font-size: 0.72rem;
  max-height: 300px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-all;
  color: var(--negative);
  line-height: 1.6;
}

/* ===== Filters ===== */
.filters {
  display: flex;
  gap: var(--sp-md);
  margin-bottom: var(--sp-md);
  align-items: center;
  flex-wrap: wrap;
}
.filters select, .filters input {
  padding: 7px 14px;
  background: var(--bg-base);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 0.8rem;
  transition: border-color 0.15s;
}
.filters select:focus, .filters input:focus {
  outline: none;
  border-color: var(--accent);
}
.filters label {
  font-size: 0.78rem;
  color: var(--text-tertiary);
  font-weight: 500;
}

/* ===== Responsive — Tablet (768px) ===== */
@media (max-width: 768px) {
  .header { padding: 10px var(--sp-md); }
  .header h1 { font-size: 0.72rem; }
  .tabs { padding: 0 var(--sp-md); }
  .tab { padding: 12px var(--sp-md); font-size: 0.8rem; }
  .content { padding: var(--sp-md); }
  .summary { grid-template-columns: 1fr 1fr; }
  .card { padding: var(--sp-md) 14px; }
  .card .value { font-size: 1.1rem; }
  .sys-grid { grid-template-columns: 1fr; }
  .theme-grid, .theme-grid.active-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .chart-container { padding: var(--sp-md); }
  .filters select, .filters input { padding: 10px var(--sp-md); font-size: 0.85rem; }

  /* Portfolio table → card view */
  #portfolio-table thead { display: none; }
  #portfolio-table tbody tr {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 14px; margin-bottom: 10px; gap: 6px 12px;
  }
  #portfolio-table tbody tr:hover td { background: transparent; }
  #portfolio-table tbody td { border: none; padding: 2px 0; font-size: 0.8rem; }
  #portfolio-table tbody td:nth-child(1) { grid-column: 1/3; font-size: 0.9rem; }
  #portfolio-table tbody td:nth-child(2) { grid-column: 1/3; color: var(--text-tertiary); font-size: 0.72rem; margin-bottom: 4px; }
  #portfolio-table tbody td:nth-child(7) { font-size: 1.1rem; font-weight: 700; }
  #portfolio-table tbody td:nth-child(8) { font-size: 1.1rem; font-weight: 700; }
  #portfolio-table tbody td:nth-child(3)::before { content: '수량 '; color: var(--text-tertiary); font-size: 0.68rem; }
  #portfolio-table tbody td:nth-child(4)::before { content: '매수 '; color: var(--text-tertiary); font-size: 0.68rem; }
  #portfolio-table tbody td:nth-child(5)::before { content: '현재 '; color: var(--text-tertiary); font-size: 0.68rem; }
  #portfolio-table tbody td:nth-child(6)::before { content: '평가 '; color: var(--text-tertiary); font-size: 0.68rem; }
  #portfolio-table tbody td:nth-child(9)::before { content: '보유 '; color: var(--text-tertiary); font-size: 0.68rem; }
  #portfolio-table tbody td:nth-child(10)::before { content: '트레일링 '; color: var(--text-tertiary); font-size: 0.68rem; }

  /* Trades table → card view */
  #panel-trades table thead { display: none; }
  #panel-trades table tbody tr {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 14px; margin-bottom: 10px; gap: 4px 12px;
  }
  #panel-trades table tbody tr:hover td { background: transparent; }
  #panel-trades table tbody td { border: none; padding: 2px 0; font-size: 0.8rem; }
  #panel-trades table tbody td:nth-child(1) { font-size: 0.68rem; color: var(--text-tertiary); }
  #panel-trades table tbody td:nth-child(2) { font-size: 0.68rem; color: var(--text-tertiary); text-align: right; }
  #panel-trades table tbody td:nth-child(3) { grid-column: 1/3; font-size: 0.9rem; font-weight: 600; }
  #panel-trades table tbody td:nth-child(8) { font-size: 1.1rem; font-weight: 700; }
  #panel-trades table tbody td:nth-child(9) { font-size: 1.1rem; font-weight: 700; }
  #panel-trades table tbody td:nth-child(10) { grid-column: 1/3; font-size: 0.72rem; color: var(--text-tertiary); }
  #panel-trades table tbody td:nth-child(5)::before { content: '수량 '; color: var(--text-tertiary); font-size: 0.68rem; }
  #panel-trades table tbody td:nth-child(6)::before { content: '가격 '; color: var(--text-tertiary); font-size: 0.68rem; }
  #panel-trades table tbody td:nth-child(7)::before { content: '금액 '; color: var(--text-tertiary); font-size: 0.68rem; }

  /* Theme History table → card view */
  #theme-history-body { display: block; }
  #theme-history-body tr {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-sm);
    padding: 12px; margin-bottom: 8px; gap: 4px 12px;
  }
  #theme-history-body tr:hover td { background: transparent; }
  #theme-history-body td { display: block; border: none; padding: 2px 0; font-size: 0.8rem; }
  #theme-history-body td:nth-child(1) { font-size: 0.68rem; color: var(--text-tertiary); }
  #theme-history-body td:nth-child(2) { font-weight: 600; font-size: 0.9rem; text-align: right; }
  #theme-history-body td:nth-child(3)::before { content: '점수 '; color: var(--text-tertiary); font-size: 0.68rem; }
  #theme-history-body td:nth-child(4)::before { content: '모멘텀 '; color: var(--text-tertiary); font-size: 0.68rem; }
  #theme-history-body td:nth-child(5)::before { content: '수급 '; color: var(--text-tertiary); font-size: 0.68rem; }
  #theme-history-body td:nth-child(6)::before { content: '뉴스 '; color: var(--text-tertiary); font-size: 0.68rem; }
  table:has(#theme-history-body) { background: transparent; border-radius: 0; overflow: visible; }
  table:has(#theme-history-body) thead { display: none; }
}

/* ===== Mobile Portrait (480px) ===== */
@media (max-width: 480px) {
  .header h1 { font-size: 0.68rem; letter-spacing: 1.5px; }
  .header .right { gap: var(--sp-sm); }
  .header .time { font-size: 0.68rem; }
  .tab { padding: 12px 12px; font-size: 0.78rem; }
  .content { padding: var(--sp-sm); }
  .summary { grid-template-columns: 1fr; gap: var(--sp-sm); }
  .card { padding: 10px 12px; }
  .card .label { font-size: 0.68rem; }
  .card .value { font-size: 1rem; }
  .theme-grid, .theme-grid.active-grid { grid-template-columns: 1fr; }
  .theme-card .score { font-size: 1.3rem; }
  .news-item { padding: 10px 12px; }
  .chart-container { padding: var(--sp-sm); margin-bottom: 10px; }
  .error-log { font-size: 0.68rem; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>Trading Dashboard</h1>
  <div class="right">
    <span class="status-dot" id="botDot"></span>
    <span class="time" id="clock"></span>
    <a href="/api/v1/auth/logout" class="logout">Logout</a>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <div class="tab active" data-tab="portfolio">Portfolio</div>
  <div class="tab" data-tab="trades">Trades</div>
  <div class="tab" data-tab="performance">Performance</div>
  <div class="tab" data-tab="news">News</div>
  <div class="tab" data-tab="system">System</div>
</div>

<!-- Content -->
<div class="content">

  <!-- ========== Portfolio ========== -->
  <div class="panel active" id="panel-portfolio">
    <div class="summary" id="portfolio-summary"></div>
    <div class="table-wrap">
      <table id="portfolio-table">
        <thead><tr>
          <th>종목</th><th>테마</th><th>수량</th><th>매수가</th><th>현재가</th><th>평가금액</th>
          <th>수익률</th><th>수익금</th><th>보유일</th><th>트레일링</th>
        </tr></thead>
        <tbody id="portfolio-body"></tbody>
      </table>
    </div>
    <hr class="section-divider">
    <div class="active-header">
      <h3>금주 투자 테마</h3>
      <span class="next-eval" id="next-eval-date"></span>
    </div>
    <div class="theme-grid active-grid" id="selected-theme-grid"></div>
    <h3 class="section-heading">일별 수집 테마</h3>
    <div class="theme-grid" id="candidate-theme-grid"></div>
    <h3 class="section-heading" style="margin-top:var(--sp-lg)">테마 점수 트렌드 (7일)</h3>
    <div class="chart-container">
      <canvas id="theme-trend-chart" height="220"></canvas>
    </div>
    <h3 class="section-heading">Theme History</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>날짜</th><th>테마</th><th>점수</th><th>모멘텀</th><th>수급비율</th><th>뉴스</th></tr></thead>
        <tbody id="theme-history-body"></tbody>
      </table>
    </div>
  </div>

  <!-- ========== Trades ========== -->
  <div class="panel" id="panel-trades">
    <div class="filters">
      <label>기간:</label>
      <select id="trades-days">
        <option value="7">7일</option>
        <option value="30" selected>30일</option>
        <option value="90">90일</option>
        <option value="365">1년</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>날짜</th><th>시간</th><th>종목</th><th>매매</th>
          <th>수량</th><th>가격</th><th>금액</th><th>수익률</th><th>수익금</th><th>사유</th>
        </tr></thead>
        <tbody id="trades-body"></tbody>
      </table>
    </div>
  </div>

  <!-- ========== Performance ========== -->
  <div class="panel" id="panel-performance">
    <div class="summary" id="perf-summary"></div>
    <div class="chart-container"><canvas id="cumReturnChart"></canvas></div>
    <div class="chart-container"><canvas id="dailyReturnChart"></canvas></div>
  </div>

  <!-- ========== News ========== -->
  <div class="panel" id="panel-news">
    <div id="news-list"><p style="color:var(--text-tertiary)">로딩 중...</p></div>
  </div>

  <!-- ========== System ========== -->
  <div class="panel" id="panel-system">
    <div class="sys-grid">
      <div>
        <div class="card" style="margin-bottom:var(--sp-md)">
          <div class="label">Bot Status</div>
          <div class="value" id="sys-bot-status">-</div>
        </div>
        <div class="card" style="margin-bottom:var(--sp-md)">
          <div class="label">PID</div>
          <div class="value" id="sys-pid" style="font-size:1rem">-</div>
        </div>
        <div class="card" style="margin-bottom:var(--sp-md)">
          <div class="label">Mode</div>
          <div class="value" id="sys-mode" style="font-size:1rem">-</div>
        </div>
        <div class="card">
          <div class="label">Server Time</div>
          <div class="value" id="sys-time" style="font-size:1rem">-</div>
        </div>
      </div>
      <div>
        <div class="label" style="font-size:0.7rem;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:var(--sp-sm)">Recent Errors</div>
        <div class="error-log" id="error-log">에러 없음</div>
      </div>
    </div>
  </div>

</div>

<script>
// ===== Utilities =====
const fmt = n => n != null ? Number(n).toLocaleString() : '-';
const fmtPct = n => n != null ? (n >= 0 ? '+' : '') + Number(n).toFixed(2) + '%' : '-';
const profitClass = n => n >= 0 ? 'profit-plus' : 'profit-minus';
const valueClass = n => n >= 0 ? 'plus' : 'minus';
const badgeLvl = l => `<span class="badge badge-l${l}">L${l}</span>`;

// ===== Clock =====
function updateClock() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  const kst = new Date(utc + 9 * 3600000);
  document.getElementById('clock').textContent = kst.toLocaleString('ko-KR', {hour12:false});
}
setInterval(updateClock, 1000);
updateClock();

// ===== Tab Switching =====
let activeTab = 'portfolio';
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelector('.tab.active').classList.remove('active');
    tab.classList.add('active');
    document.querySelector('.panel.active').classList.remove('active');
    activeTab = tab.dataset.tab;
    document.getElementById('panel-' + activeTab).classList.add('active');
    loadTab(activeTab);
  });
});

// ===== API =====
async function api(path) {
  const res = await fetch('/api/v1' + path);
  if (res.status === 401) { window.location = '/login'; return null; }
  return res.json();
}

// ===== Portfolio =====
let holdingsData = [];

async function loadPortfolio() {
  const d = await api('/portfolio');
  if (!d) return;
  holdingsData = d.holdings || [];

  document.getElementById('portfolio-summary').innerHTML = `
    <div class="card"><div class="label">총 투자</div><div class="value">${fmt(d.total_invest)}원</div></div>
    <div class="card"><div class="label">총 평가</div><div class="value">${fmt(d.total_eval)}원</div></div>
    <div class="card"><div class="label">평가 손익</div><div class="value ${valueClass(d.unrealized_pnl)}">${fmt(d.unrealized_pnl)}원 (${fmtPct(d.unrealized_rate)})</div></div>
    <div class="card"><div class="label">실현 손익</div><div class="value ${valueClass(d.realized_pnl)}">${fmt(d.realized_pnl)}원 (${d.realized_count}건)</div></div>
    <div class="card"><div class="label">투입 자본</div><div class="value">${fmt(d.total_capital)}원</div></div>
    <div class="card"><div class="label">현재 자산</div><div class="value ${valueClass(d.total_return)}">${fmt(d.current_total)}원 (${fmtPct(d.total_return)})</div></div>
  `;

  const tbody = document.getElementById('portfolio-body');
  if (!holdingsData.length) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text-tertiary)">보유 종목 없음</td></tr>';
  } else {
    tbody.innerHTML = holdingsData.map(h => `<tr>
      <td><strong>${h.stock_name}</strong><br><span style="color:var(--text-tertiary);font-size:0.72rem">${h.stock_code}</span></td>
      <td>${h.theme || '-'}</td>
      <td>${fmt(h.shares)}</td>
      <td>${fmt(h.buy_price)}</td>
      <td>${fmt(h.current_price)}</td>
      <td>${fmt(h.eval_amount)}원</td>
      <td class="${profitClass(h.profit_rate)}">${fmtPct(h.profit_rate)}</td>
      <td class="${profitClass(h.profit)}">${fmt(h.profit)}원</td>
      <td>${h.hold_days}일<span style="color:var(--text-tertiary);font-size:0.72rem">(${h.hold_trading_days})</span></td>
      <td>${badgeLvl(h.trailing_level)}${h.trailing_stop_price ? '<br><span style="font-size:0.68rem;color:var(--text-tertiary)">@'+fmt(h.trailing_stop_price)+'</span>' : ''}</td>
    </tr>`).join('');
  }

  // Theme data
  const themeData = await api('/themes?days=14');

  const _themeHistMap = {};
  if (themeData && themeData.history) {
    for (const h of themeData.history) {
      const key = h.theme_name;
      if (!_themeHistMap[key]) _themeHistMap[key] = [];
      _themeHistMap[key].push({ date: h.date, score: Number(h.score) });
    }
    for (const key of Object.keys(_themeHistMap)) {
      _themeHistMap[key].sort((a, b) => b.date.localeCompare(a.date));
    }
  }

  function renderThemeCards(themes, gridId, cardClass, badgeLabel, badgeClass) {
    const grid = document.getElementById(gridId);
    if (!themes || !themes.length) {
      grid.innerHTML = '<p style="color:var(--text-tertiary)">테마 데이터 없음</p>';
      return;
    }
    grid.innerHTML = themes.map((t, idx) => {
      const score = Number(t.score);
      const grade = score >= 58 ? 'S' : score >= 48 ? 'A' : score >= 38 ? 'B' : score >= 30 ? 'C' : 'D';
      const gradeColor = score >= 58 ? 'var(--positive)' : score >= 48 ? 'var(--info)' : score >= 38 ? 'var(--accent)' : 'var(--text-tertiary)';
      let meta = `Momentum: ${Number(t.momentum||0).toFixed(1)}`;
      if (t.supply_ratio) meta += ` | Supply: ${Number(t.supply_ratio).toFixed(0)}%`;
      if (t.news_count) meta += ` | News: ${t.news_count}`;
      const rank = cardClass === 'active' ? `<span style="color:var(--accent);font-size:0.72rem;margin-right:4px">#${idx+1}</span>` : '';
      let deltaHtml = '';
      const hist = _themeHistMap[t.theme_name];
      if (hist && hist.length >= 2) {
        const delta = hist[0].score - hist[1].score;
        const dColor = delta > 0 ? 'var(--positive)' : delta < 0 ? 'var(--negative)' : 'var(--text-tertiary)';
        const dSign = delta > 0 ? '+' : '';
        deltaHtml = ` <span style="color:${dColor};font-size:0.72rem">${dSign}${delta.toFixed(1)}</span>`;
      }
      return `<div class="theme-card ${cardClass}">
        <div class="name">${rank}${t.theme_name} <span style="color:${gradeColor};font-size:0.78rem;font-weight:600">${grade}</span>${deltaHtml}<span class="theme-badge ${badgeClass}">${badgeLabel}</span></div>
        <div class="score">${score.toFixed(1)}</div>
        <div class="meta">${meta}</div>
        <div class="meta" style="margin-top:4px;font-size:0.62rem">${t.date}</div>
      </div>`;
    }).join('');
  }

  if (themeData) {
    const activeThemes = themeData.selected_themes && themeData.selected_themes.length
      ? themeData.selected_themes : themeData.current_themes;
    renderThemeCards(activeThemes, 'selected-theme-grid', 'active', 'ACTIVE', 'badge-active');
    renderThemeCards(themeData.candidate_themes, 'candidate-theme-grid', 'candidate', 'REVIEW', 'badge-candidate');
    if (activeThemes && activeThemes.length) {
      const selDate = new Date(activeThemes[0].date);
      const nextTue = new Date(selDate);
      nextTue.setDate(nextTue.getDate() + ((9 - nextTue.getDay()) % 7 || 7));
      document.getElementById('next-eval-date').textContent =
        `(${activeThemes[0].date} 선정 / 다음 재평가: ${nextTue.toISOString().slice(0,10)})`;
    }
  } else {
    document.getElementById('selected-theme-grid').innerHTML = '<p style="color:var(--text-tertiary)">테마 데이터 없음</p>';
    document.getElementById('candidate-theme-grid').innerHTML = '';
  }

  // Theme history table
  const histBody = document.getElementById('theme-history-body');
  histBody.innerHTML = (themeData && themeData.history || []).slice(0, 50).map(t => `<tr>
    <td>${t.date}</td><td>${t.theme_name}</td><td>${Number(t.score).toFixed(1)}</td>
    <td>${Number(t.momentum||0).toFixed(1)}</td><td>${Number(t.supply_ratio||0).toFixed(0)}%</td><td>${t.news_count||0}</td>
  </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--text-tertiary)">히스토리 없음</td></tr>';

  // Theme trend chart
  (function renderThemeTrendChart() {
    const ctx = document.getElementById('theme-trend-chart');
    if (!ctx || !themeData || !themeData.history || !themeData.history.length) return;

    const activeNames = new Set();
    const activeThemes = themeData.selected_themes && themeData.selected_themes.length
      ? themeData.selected_themes : themeData.current_themes;
    if (activeThemes) activeThemes.forEach(t => activeNames.add(t.theme_name));

    const allDates = [...new Set(themeData.history.map(h => h.date))].sort();
    const dates = allDates.slice(-7);

    const candidateNames = new Set();
    if (themeData.candidate_themes) {
      themeData.candidate_themes.slice(0, 3).forEach(t => candidateNames.add(t.theme_name));
    }
    const targetNames = new Set([...activeNames, ...candidateNames]);

    const series = {};
    for (const h of themeData.history) {
      if (!targetNames.has(h.theme_name)) continue;
      if (!series[h.theme_name]) series[h.theme_name] = {};
      series[h.theme_name][h.date] = Number(h.score);
    }

    const activeColors = ['#c9983e','#3bb888','#6889c6','#b87db8','#d4945a'];
    const candidateColors = ['#3d4352','#4a5060','#565e70'];
    const datasets = [];
    let aIdx = 0, cIdx = 0;

    for (const name of Object.keys(series)) {
      const isActive = activeNames.has(name);
      const color = isActive ? activeColors[aIdx++ % activeColors.length] : candidateColors[cIdx++ % candidateColors.length];
      datasets.push({
        label: name,
        data: dates.map(d => series[name][d] ?? null),
        borderColor: color,
        backgroundColor: color + '18',
        borderWidth: isActive ? 2 : 1.5,
        borderDash: isActive ? [] : [5, 3],
        pointRadius: isActive ? 3 : 2,
        tension: 0.3,
        spanGaps: true,
      });
    }

    datasets.push({
      label: 'B등급 (38점)',
      data: dates.map(() => 38),
      borderColor: '#d9566b',
      borderWidth: 1,
      borderDash: [3, 3],
      pointRadius: 0,
      fill: false,
    });

    if (trendChart) { trendChart.destroy(); trendChart = null; }
    trendChart = new Chart(ctx, {
      type: 'line',
      data: { labels: dates.map(d => d.slice(5)), datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#7e8594', font: { size: 11, family: 'Pretendard Variable, sans-serif' } }, position: 'bottom' },
          tooltip: { mode: 'index', intersect: false },
        },
        scales: {
          x: { ticks: { color: '#515868' }, grid: { color: '#252d3f' } },
          y: { ticks: { color: '#515868' }, grid: { color: '#252d3f' }, min: 0 },
        },
      }
    });
  })();
}

// ===== Theme Trend Chart instance =====
let trendChart = null;

// ===== Trades =====
async function loadTrades() {
  const days = document.getElementById('trades-days').value;
  const d = await api('/trades?days=' + days);
  if (!d) return;
  const tbody = document.getElementById('trades-body');
  if (!d.trades.length) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text-tertiary)">매매 내역 없음</td></tr>';
    return;
  }
  tbody.innerHTML = d.trades.map(t => {
    const isBuy = t.action === 'buy';
    return `<tr>
      <td>${t.date}</td><td>${t.time || '-'}</td>
      <td>${t.stock_name}<br><span style="color:var(--text-tertiary);font-size:0.68rem">${t.stock_code}</span></td>
      <td style="color:${isBuy?'var(--info)':'var(--negative)'};font-weight:600">${isBuy?'매수':'매도'}</td>
      <td>${fmt(t.shares)}</td><td>${fmt(t.price)}</td><td>${fmt(t.amount)}</td>
      <td class="${profitClass(t.profit_rate)}">${t.profit_rate != null ? fmtPct(t.profit_rate) : '-'}</td>
      <td class="${profitClass(t.profit_amount)}">${t.profit_amount != null ? fmt(t.profit_amount)+'원' : '-'}</td>
      <td>${t.reason || '-'}</td>
    </tr>`;
  }).join('');
}
document.getElementById('trades-days').addEventListener('change', loadTrades);

// ===== Performance =====
let cumChart = null, dailyChart = null;

async function loadPerformance() {
  const d = await api('/performance?days=90');
  if (!d) return;

  document.getElementById('perf-summary').innerHTML = `
    <div class="card"><div class="label">Sharpe Ratio</div><div class="value">${d.sharpe_ratio ? Number(d.sharpe_ratio).toFixed(2) : '-'}</div></div>
    <div class="card"><div class="label">MDD</div><div class="value minus">${d.mdd ? Number(d.mdd).toFixed(2)+'%' : '-'}</div></div>
    <div class="card"><div class="label">Win Rate</div><div class="value">${d.win_rate}%</div></div>
    <div class="card"><div class="label">Trades</div><div class="value">${d.win_count}W / ${d.loss_count}L</div></div>
  `;

  const chartOpt = {
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: '#515868', maxTicksLimit: 10, font: { family: 'Pretendard Variable, sans-serif' } }, grid: { color: '#252d3f' } },
      y: { ticks: { color: '#515868', font: { family: 'Pretendard Variable, sans-serif' } }, grid: { color: '#252d3f' } }
    }
  };

  if (cumChart) cumChart.destroy();
  cumChart = new Chart(document.getElementById('cumReturnChart'), {
    type: 'line', data: { labels: d.dates, datasets: [{
      data: d.cumulative_returns, borderColor: '#6889c6', backgroundColor: 'rgba(104,137,198,0.06)', fill: true, tension: 0.3, pointRadius: 0, borderWidth: 2
    }] }, options: { ...chartOpt, plugins: { ...chartOpt.plugins, title: { display: true, text: 'Cumulative Return (%)', color: '#7e8594', font: { family: 'Pretendard Variable, sans-serif' } } } }
  });

  if (dailyChart) dailyChart.destroy();
  dailyChart = new Chart(document.getElementById('dailyReturnChart'), {
    type: 'bar', data: { labels: d.dates, datasets: [{
      data: d.daily_returns, backgroundColor: d.daily_returns.map(v => v >= 0 ? 'rgba(59,184,136,0.55)' : 'rgba(217,86,107,0.55)'), borderWidth: 0
    }] }, options: { ...chartOpt, plugins: { ...chartOpt.plugins, title: { display: true, text: 'Daily Return (%)', color: '#7e8594', font: { family: 'Pretendard Variable, sans-serif' } } } }
  });
}

// ===== News =====
async function loadNews() {
  const el = document.getElementById('news-list');
  el.innerHTML = '<p style="color:var(--text-tertiary)">뉴스 로딩 중...</p>';
  const d = await api('/news');
  if (!d) return;
  if (!d.news || !d.news.length) {
    el.innerHTML = '<p style="color:var(--text-tertiary)">뉴스 없음</p>';
    return;
  }
  el.innerHTML = d.news.map(n => `
    <div class="news-item">
      <div class="title"><a href="${n.url || '#'}" target="_blank">${n.title || '제목 없음'}</a></div>
      <div class="meta">${n.stock_name ? n.stock_name + ' | ' : ''}${n.date || ''} ${n.source || ''}</div>
    </div>
  `).join('');
}

// ===== System =====
async function loadSystem() {
  const d = await api('/system/status');
  if (!d) return;
  document.getElementById('sys-bot-status').textContent = d.bot_status;
  document.getElementById('sys-bot-status').style.color = d.bot_status === 'active' ? 'var(--positive)' : 'var(--negative)';
  document.getElementById('botDot').className = 'status-dot' + (d.bot_status === 'active' ? '' : ' off');
  document.getElementById('sys-pid').textContent = d.pid || '-';
  document.getElementById('sys-mode').textContent = d.is_mock ? 'MOCK' : 'REAL';
  document.getElementById('sys-mode').style.color = d.is_mock ? 'var(--accent)' : 'var(--positive)';
  document.getElementById('sys-time').textContent = d.server_time;
  const logEl = document.getElementById('error-log');
  logEl.textContent = d.recent_errors.length ? d.recent_errors.join('\n') : '에러 없음';
}

// ===== Tab Load =====
function loadTab(tab) {
  switch(tab) {
    case 'portfolio': loadPortfolio(); break;
    case 'trades': loadTrades(); break;
    case 'performance': loadPerformance(); break;
    case 'news': loadNews(); break;
    case 'system': loadSystem(); break;
  }
}

// ===== SSE Realtime Prices =====
let evtSource = null;
function startSSE() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource('/api/v1/stream/prices');
  evtSource.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.error) return;
      if (activeTab === 'portfolio' && d.holdings) {
        holdingsData = d.holdings;
        updatePortfolioTable(d);
      }
    } catch {}
  };
  evtSource.onerror = () => {
    evtSource.close();
    setTimeout(startSSE, 10000);
  };
}

function updatePortfolioTable(d) {
  const summaryEl = document.getElementById('portfolio-summary');
  if (summaryEl.children.length >= 3) {
    summaryEl.children[1].querySelector('.value').textContent = fmt(d.total_eval) + '원';
    summaryEl.children[2].querySelector('.value').className = 'value ' + valueClass(d.unrealized_pnl);
    summaryEl.children[2].querySelector('.value').innerHTML = fmt(d.unrealized_pnl) + '원 (' + fmtPct(d.unrealized_rate) + ')';
    if (summaryEl.children[5]) {
      summaryEl.children[5].querySelector('.value').className = 'value ' + valueClass(d.total_return);
      summaryEl.children[5].querySelector('.value').innerHTML = fmt(d.current_total) + '원 (' + fmtPct(d.total_return) + ')';
    }
  }

  const tbody = document.getElementById('portfolio-body');
  if (!d.holdings.length) return;
  tbody.innerHTML = d.holdings.map(h => `<tr>
    <td><strong>${h.stock_name}</strong><br><span style="color:var(--text-tertiary);font-size:0.72rem">${h.stock_code}</span></td>
    <td>${h.theme || '-'}</td>
    <td>${fmt(h.shares)}</td>
    <td>${fmt(h.buy_price)}</td>
    <td>${fmt(h.current_price)}</td>
    <td>${fmt(h.eval_amount)}원</td>
    <td class="${profitClass(h.profit_rate)}">${fmtPct(h.profit_rate)}</td>
    <td class="${profitClass(h.profit)}">${fmt(h.profit)}원</td>
    <td>${h.hold_days}일<span style="color:var(--text-tertiary);font-size:0.72rem">(${h.hold_trading_days})</span></td>
    <td>${badgeLvl(h.trailing_level)}${h.trailing_stop_price ? '<br><span style="font-size:0.68rem;color:var(--text-tertiary)">@'+fmt(h.trailing_stop_price)+'</span>' : ''}</td>
  </tr>`).join('');
}

// ===== Initial Load =====
loadPortfolio();
loadSystem();
startSSE();
</script>
</body>
</html>
