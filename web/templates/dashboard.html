<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ===== 디자인 토큰 ===== */
:root {
  --bg: #0a0a0f;
  --card: #12121a;
  --border: #1e1e2e;
  --cyan: #00f5ff;
  --green: #00ff88;
  --red: #ff3366;
  --yellow: #ffaa00;
  --text: #e0e0e0;
  --text2: #888;
  --glow-cyan: 0 0 10px rgba(0,245,255,0.3);
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:14px; }

/* ===== 헤더 ===== */
.header {
  display:flex; justify-content:space-between; align-items:center;
  padding:12px 24px; border-bottom:1px solid var(--border); background:var(--card);
}
.header h1 { font-size:1.1rem; color:var(--cyan); text-shadow:var(--glow-cyan); letter-spacing:1px; }
.header .right { display:flex; align-items:center; gap:16px; }
.header .time { color:var(--text2); font-size:0.8rem; }
.header .logout { color:var(--text2); text-decoration:none; font-size:0.8rem; }
.header .logout:hover { color:var(--red); }
.header .status-dot { width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; }
.header .status-dot.off { background:var(--red); }

/* ===== 탭 ===== */
.tabs {
  display:flex; gap:0; border-bottom:1px solid var(--border); background:var(--card);
  padding:0 24px; overflow-x:auto;
}
.tab {
  padding:10px 20px; cursor:pointer; color:var(--text2); font-size:0.85rem;
  border-bottom:2px solid transparent; transition:all .2s; white-space:nowrap;
}
.tab:hover { color:var(--text); }
.tab.active { color:var(--cyan); border-bottom-color:var(--cyan); }

/* ===== 컨텐츠 ===== */
.content { padding:20px 24px; max-width:1400px; margin:0 auto; }
.panel { display:none; }
.panel.active { display:block; }

/* ===== 요약 카드 ===== */
.summary {
  display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px;
}
.card {
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:16px 20px;
}
.card .label { font-size:0.75rem; color:var(--text2); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
.card .value { font-size:1.4rem; font-weight:700; }
.card .value.plus { color:var(--green); }
.card .value.minus { color:var(--red); }

/* ===== 테이블 ===== */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; }
th { background:#16162a; color:var(--text2); font-weight:600; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.5px; text-align:left; padding:10px 12px; }
td { padding:10px 12px; border-top:1px solid var(--border); font-size:0.85rem; }
tr:hover td { background:#16162a; }

/* ===== 배지 ===== */
.badge { display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.7rem; font-weight:700; }
.badge-l0 { background:#333; color:#888; }
.badge-l1 { background:rgba(0,245,255,0.15); color:var(--cyan); }
.badge-l2 { background:rgba(0,255,136,0.15); color:var(--green); }
.badge-l3 { background:rgba(255,170,0,0.15); color:var(--yellow); }

.profit-plus { color:var(--green); }
.profit-minus { color:var(--red); }

/* ===== 차트 ===== */
.chart-container { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; margin-bottom:16px; }
.chart-container canvas { max-height:300px; }

/* ===== 섹션 구분선 ===== */
.section-divider { border:none; border-top:3px solid var(--border); margin:28px 0 20px; }

/* ===== 테마 카드 ===== */
.theme-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-bottom:20px; }
.theme-card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; transition:border-color .2s; }
.theme-card.selected { border-color:var(--green); box-shadow:0 0 8px rgba(0,255,136,0.15); }
.theme-card.candidate { border-color:var(--border); opacity:0.85; }
.theme-card .name { font-size:1rem; font-weight:700; color:var(--cyan); margin-bottom:8px; }
.theme-card .score { font-size:1.8rem; font-weight:700; }
.theme-card .meta { font-size:0.75rem; color:var(--text2); margin-top:6px; }
.theme-badge { display:inline-block; padding:2px 6px; border-radius:3px; font-size:0.6rem; font-weight:700; margin-left:6px; vertical-align:middle; }
.theme-badge.badge-selected { background:rgba(0,255,136,0.15); color:var(--green); }
.theme-badge.badge-candidate { background:rgba(136,136,136,0.15); color:var(--text2); }

/* ===== 뉴스 ===== */
.news-item { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:8px; }
.news-item .title { font-weight:600; margin-bottom:4px; }
.news-item .title a { color:var(--text); text-decoration:none; }
.news-item .title a:hover { color:var(--cyan); }
.news-item .meta { font-size:0.75rem; color:var(--text2); }

/* ===== 시스템 ===== */
.sys-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.error-log { background:#1a0a0a; border:1px solid #2a1515; border-radius:8px; padding:12px; font-family:monospace; font-size:0.75rem; max-height:300px; overflow-y:auto; white-space:pre-wrap; word-break:break-all; color:var(--red); }

/* ===== 필터 ===== */
.filters { display:flex; gap:12px; margin-bottom:16px; align-items:center; flex-wrap:wrap; }
.filters select, .filters input { padding:6px 12px; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:0.8rem; }
.filters label { font-size:0.8rem; color:var(--text2); }

/* ===== 반응형 ===== */
@media(max-width:768px) {
  .summary { grid-template-columns:1fr 1fr; }
  .sys-grid { grid-template-columns:1fr; }
  .content { padding:12px; }
}
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <h1>TRADING DASHBOARD</h1>
  <div class="right">
    <span class="status-dot" id="botDot"></span>
    <span class="time" id="clock"></span>
    <a href="/api/v1/auth/logout" class="logout">Logout</a>
  </div>
</div>

<!-- 탭 -->
<div class="tabs">
  <div class="tab active" data-tab="portfolio">Portfolio</div>
  <div class="tab" data-tab="trades">Trades</div>
  <div class="tab" data-tab="performance">Performance</div>
  <div class="tab" data-tab="news">News</div>
  <div class="tab" data-tab="system">System</div>
</div>

<!-- 컨텐츠 -->
<div class="content">

  <!-- ========== Portfolio ========== -->
  <div class="panel active" id="panel-portfolio">
    <div class="summary" id="portfolio-summary"></div>
    <div class="table-wrap">
      <table id="portfolio-table">
        <thead><tr>
          <th>종목</th><th>테마</th><th>수량</th><th>매수가</th><th>현재가</th><th>평가금액</th>
          <th>수익률</th><th>수익금</th><th>보유일</th><th>트레일링</th>
        </tr></thead>
        <tbody id="portfolio-body"></tbody>
      </table>
    </div>
    <hr class="section-divider">
    <h3 style="margin:0 0 12px;color:var(--green)">금주 선정 테마</h3>
    <div class="theme-grid" id="selected-theme-grid"></div>
    <h3 style="margin:16px 0 12px;color:var(--text2)">검토/조사 중 테마</h3>
    <div class="theme-grid" id="candidate-theme-grid"></div>
    <h3 style="margin:4px 0 12px">Theme History</h3>
    <div class="table-wrap">
      <table>
        <thead><tr><th>날짜</th><th>테마</th><th>점수</th><th>모멘텀</th><th>수급비율</th><th>뉴스</th></tr></thead>
        <tbody id="theme-history-body"></tbody>
      </table>
    </div>
  </div>

  <!-- ========== Trades ========== -->
  <div class="panel" id="panel-trades">
    <div class="filters">
      <label>기간:</label>
      <select id="trades-days">
        <option value="7">7일</option>
        <option value="30" selected>30일</option>
        <option value="90">90일</option>
        <option value="365">1년</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>날짜</th><th>시간</th><th>종목</th><th>매매</th>
          <th>수량</th><th>가격</th><th>금액</th><th>수익률</th><th>수익금</th><th>사유</th>
        </tr></thead>
        <tbody id="trades-body"></tbody>
      </table>
    </div>
  </div>

  <!-- ========== Performance ========== -->
  <div class="panel" id="panel-performance">
    <div class="summary" id="perf-summary"></div>
    <div class="chart-container"><canvas id="cumReturnChart"></canvas></div>
    <div class="chart-container"><canvas id="dailyReturnChart"></canvas></div>
  </div>

  <!-- ========== News ========== -->
  <div class="panel" id="panel-news">
    <div id="news-list"><p style="color:var(--text2)">로딩 중...</p></div>
  </div>

  <!-- ========== System ========== -->
  <div class="panel" id="panel-system">
    <div class="sys-grid">
      <div>
        <div class="card" style="margin-bottom:12px">
          <div class="label">Bot Status</div>
          <div class="value" id="sys-bot-status">-</div>
        </div>
        <div class="card" style="margin-bottom:12px">
          <div class="label">PID</div>
          <div class="value" id="sys-pid" style="font-size:1rem">-</div>
        </div>
        <div class="card" style="margin-bottom:12px">
          <div class="label">Mode</div>
          <div class="value" id="sys-mode" style="font-size:1rem">-</div>
        </div>
        <div class="card">
          <div class="label">Server Time</div>
          <div class="value" id="sys-time" style="font-size:1rem">-</div>
        </div>
      </div>
      <div>
        <div class="label" style="margin-bottom:8px">RECENT ERRORS</div>
        <div class="error-log" id="error-log">에러 없음</div>
      </div>
    </div>
  </div>


</div>

<script>
// ===== 유틸 =====
const fmt = n => n != null ? Number(n).toLocaleString() : '-';
const fmtPct = n => n != null ? (n >= 0 ? '+' : '') + Number(n).toFixed(2) + '%' : '-';
const profitClass = n => n >= 0 ? 'profit-plus' : 'profit-minus';
const valueClass = n => n >= 0 ? 'plus' : 'minus';
const badgeLvl = l => `<span class="badge badge-l${l}">L${l}</span>`;

// ===== 시계 =====
function updateClock() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  const kst = new Date(utc + 9 * 3600000);
  document.getElementById('clock').textContent = kst.toLocaleString('ko-KR', {hour12:false});
}
setInterval(updateClock, 1000);
updateClock();

// ===== 탭 전환 =====
let activeTab = 'portfolio';
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelector('.tab.active').classList.remove('active');
    tab.classList.add('active');
    document.querySelector('.panel.active').classList.remove('active');
    activeTab = tab.dataset.tab;
    document.getElementById('panel-' + activeTab).classList.add('active');
    loadTab(activeTab);
  });
});

// ===== API 호출 =====
async function api(path) {
  const res = await fetch('/api/v1' + path);
  if (res.status === 401) { window.location = '/login'; return null; }
  return res.json();
}

// ===== Portfolio =====
let holdingsData = [];

async function loadPortfolio() {
  const d = await api('/portfolio');
  if (!d) return;
  holdingsData = d.holdings || [];

  document.getElementById('portfolio-summary').innerHTML = `
    <div class="card"><div class="label">총 투자</div><div class="value">${fmt(d.total_invest)}원</div></div>
    <div class="card"><div class="label">총 평가</div><div class="value">${fmt(d.total_eval)}원</div></div>
    <div class="card"><div class="label">평가 손익</div><div class="value ${valueClass(d.unrealized_pnl)}">${fmt(d.unrealized_pnl)}원 (${fmtPct(d.unrealized_rate)})</div></div>
    <div class="card"><div class="label">실현 손익</div><div class="value ${valueClass(d.realized_pnl)}">${fmt(d.realized_pnl)}원 (${d.realized_count}건)</div></div>
    <div class="card"><div class="label">투입 자본</div><div class="value">${fmt(d.total_capital)}원</div></div>
    <div class="card"><div class="label">현재 자산</div><div class="value ${valueClass(d.total_return)}">${fmt(d.current_total)}원 (${fmtPct(d.total_return)})</div></div>
  `;

  const tbody = document.getElementById('portfolio-body');
  if (!holdingsData.length) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text2)">보유 종목 없음</td></tr>';
  } else {
    tbody.innerHTML = holdingsData.map(h => `<tr>
      <td><strong>${h.stock_name}</strong><br><span style="color:var(--text2);font-size:0.75rem">${h.stock_code}</span></td>
      <td>${h.theme || '-'}</td>
      <td>${fmt(h.shares)}</td>
      <td>${fmt(h.buy_price)}</td>
      <td>${fmt(h.current_price)}</td>
      <td>${fmt(h.eval_amount)}원</td>
      <td class="${profitClass(h.profit_rate)}">${fmtPct(h.profit_rate)}</td>
      <td class="${profitClass(h.profit)}">${fmt(h.profit)}원</td>
      <td>${h.hold_days}일</td>
      <td>${badgeLvl(h.trailing_level)}${h.trailing_stop_price ? '<br><span style="font-size:0.7rem;color:var(--text2)">@'+fmt(h.trailing_stop_price)+'</span>' : ''}</td>
    </tr>`).join('');
  }

  // 포트폴리오 하단 테마 로드
  const themeData = await api('/themes?days=7');

  function renderThemeCards(themes, gridId, cardClass, badgeLabel, badgeClass) {
    const grid = document.getElementById(gridId);
    if (!themes || !themes.length) {
      grid.innerHTML = '<p style="color:var(--text2)">테마 데이터 없음</p>';
      return;
    }
    grid.innerHTML = themes.map(t => {
      const score = Number(t.score);
      const grade = score >= 58 ? 'S' : score >= 48 ? 'A' : score >= 38 ? 'B' : score >= 30 ? 'C' : 'D';
      const gradeColor = score >= 58 ? 'var(--green)' : score >= 48 ? 'var(--cyan)' : score >= 38 ? 'var(--yellow)' : 'var(--text2)';
      let meta = `Momentum: ${Number(t.momentum||0).toFixed(1)}`;
      if (t.supply_ratio) meta += ` | Supply: ${Number(t.supply_ratio).toFixed(0)}%`;
      if (t.news_count) meta += ` | News: ${t.news_count}`;
      return `<div class="theme-card ${cardClass}">
        <div class="name">${t.theme_name} <span style="color:${gradeColor};font-size:0.8rem">${grade}</span><span class="theme-badge ${badgeClass}">${badgeLabel}</span></div>
        <div class="score">${score.toFixed(1)}</div>
        <div class="meta">${meta}</div>
        <div class="meta" style="margin-top:4px;font-size:0.65rem">${t.date}</div>
      </div>`;
    }).join('');
  }

  if (themeData) {
    // selected_themes가 있으면 2단 분리, 없으면 current_themes 폴백
    const selectedThemes = themeData.selected_themes && themeData.selected_themes.length
      ? themeData.selected_themes : themeData.current_themes;
    renderThemeCards(selectedThemes, 'selected-theme-grid', 'selected', 'SELECTED', 'badge-selected');
    renderThemeCards(themeData.candidate_themes, 'candidate-theme-grid', 'candidate', 'REVIEW', 'badge-candidate');
  } else {
    document.getElementById('selected-theme-grid').innerHTML = '<p style="color:var(--text2)">테마 데이터 없음</p>';
    document.getElementById('candidate-theme-grid').innerHTML = '';
  }

  // 테마 히스토리 테이블
  const histBody = document.getElementById('theme-history-body');
  histBody.innerHTML = (themeData && themeData.history || []).slice(0, 50).map(t => `<tr>
    <td>${t.date}</td><td>${t.theme_name}</td><td>${Number(t.score).toFixed(1)}</td>
    <td>${Number(t.momentum||0).toFixed(1)}</td><td>${Number(t.supply_ratio||0).toFixed(0)}%</td><td>${t.news_count||0}</td>
  </tr>`).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--text2)">히스토리 없음</td></tr>';
}

// ===== Trades =====
async function loadTrades() {
  const days = document.getElementById('trades-days').value;
  const d = await api('/trades?days=' + days);
  if (!d) return;
  const tbody = document.getElementById('trades-body');
  if (!d.trades.length) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--text2)">매매 내역 없음</td></tr>';
    return;
  }
  tbody.innerHTML = d.trades.map(t => {
    const isBuy = t.action === 'buy';
    return `<tr>
      <td>${t.date}</td><td>${t.time || '-'}</td>
      <td>${t.stock_name}<br><span style="color:var(--text2);font-size:0.7rem">${t.stock_code}</span></td>
      <td style="color:${isBuy?'var(--cyan)':'var(--red)'}">${isBuy?'매수':'매도'}</td>
      <td>${fmt(t.shares)}</td><td>${fmt(t.price)}</td><td>${fmt(t.amount)}</td>
      <td class="${profitClass(t.profit_rate)}">${t.profit_rate != null ? fmtPct(t.profit_rate) : '-'}</td>
      <td class="${profitClass(t.profit_amount)}">${t.profit_amount != null ? fmt(t.profit_amount)+'원' : '-'}</td>
      <td>${t.reason || '-'}</td>
    </tr>`;
  }).join('');
}
document.getElementById('trades-days').addEventListener('change', loadTrades);

// ===== Performance =====
let cumChart = null, dailyChart = null;

async function loadPerformance() {
  const d = await api('/performance?days=90');
  if (!d) return;

  document.getElementById('perf-summary').innerHTML = `
    <div class="card"><div class="label">Sharpe Ratio</div><div class="value">${d.sharpe_ratio ? Number(d.sharpe_ratio).toFixed(2) : '-'}</div></div>
    <div class="card"><div class="label">MDD</div><div class="value minus">${d.mdd ? Number(d.mdd).toFixed(2)+'%' : '-'}</div></div>
    <div class="card"><div class="label">Win Rate</div><div class="value">${d.win_rate}%</div></div>
    <div class="card"><div class="label">Trades</div><div class="value">${d.win_count}W / ${d.loss_count}L</div></div>
  `;

  const chartOpt = { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
    scales:{x:{ticks:{color:'#555',maxTicksLimit:10}},y:{ticks:{color:'#555'},grid:{color:'#1e1e2e'}}} };

  if (cumChart) cumChart.destroy();
  cumChart = new Chart(document.getElementById('cumReturnChart'), {
    type:'line', data:{ labels:d.dates, datasets:[{
      data:d.cumulative_returns, borderColor:'#00f5ff', backgroundColor:'rgba(0,245,255,0.05)', fill:true, tension:0.3, pointRadius:0, borderWidth:2
    }]}, options:{...chartOpt, plugins:{...chartOpt.plugins, title:{display:true,text:'Cumulative Return (%)',color:'#888'}}}
  });

  if (dailyChart) dailyChart.destroy();
  dailyChart = new Chart(document.getElementById('dailyReturnChart'), {
    type:'bar', data:{ labels:d.dates, datasets:[{
      data:d.daily_returns, backgroundColor: d.daily_returns.map(v => v >= 0 ? 'rgba(0,255,136,0.6)' : 'rgba(255,51,102,0.6)'), borderWidth:0
    }]}, options:{...chartOpt, plugins:{...chartOpt.plugins, title:{display:true,text:'Daily Return (%)',color:'#888'}}}
  });
}

// ===== News =====
async function loadNews() {
  const el = document.getElementById('news-list');
  el.innerHTML = '<p style="color:var(--text2)">뉴스 로딩 중...</p>';
  const d = await api('/news');
  if (!d) return;
  if (!d.news || !d.news.length) {
    el.innerHTML = '<p style="color:var(--text2)">뉴스 없음</p>';
    return;
  }
  el.innerHTML = d.news.map(n => `
    <div class="news-item">
      <div class="title"><a href="${n.url || '#'}" target="_blank">${n.title || '제목 없음'}</a></div>
      <div class="meta">${n.stock_name ? n.stock_name + ' | ' : ''}${n.date || ''} ${n.source || ''}</div>
    </div>
  `).join('');
}

// ===== System =====
async function loadSystem() {
  const d = await api('/system/status');
  if (!d) return;
  document.getElementById('sys-bot-status').textContent = d.bot_status;
  document.getElementById('sys-bot-status').style.color = d.bot_status === 'active' ? 'var(--green)' : 'var(--red)';
  document.getElementById('botDot').className = 'status-dot' + (d.bot_status === 'active' ? '' : ' off');
  document.getElementById('sys-pid').textContent = d.pid || '-';
  document.getElementById('sys-mode').textContent = d.is_mock ? 'MOCK' : 'REAL';
  document.getElementById('sys-mode').style.color = d.is_mock ? 'var(--yellow)' : 'var(--green)';
  document.getElementById('sys-time').textContent = d.server_time;
  const logEl = document.getElementById('error-log');
  logEl.textContent = d.recent_errors.length ? d.recent_errors.join('\n') : '에러 없음';
}

// ===== 탭 로드 =====
function loadTab(tab) {
  switch(tab) {
    case 'portfolio': loadPortfolio(); break;
    case 'trades': loadTrades(); break;
    case 'performance': loadPerformance(); break;
    case 'news': loadNews(); break;
    case 'system': loadSystem(); break;
  }
}

// ===== SSE 실시간 가격 =====
let evtSource = null;
function startSSE() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource('/api/v1/stream/prices');
  evtSource.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      if (d.error) return;
      // Portfolio 탭이 활성이면 테이블 업데이트
      if (activeTab === 'portfolio' && d.holdings) {
        holdingsData = d.holdings;
        updatePortfolioTable(d);
      }
    } catch {}
  };
  evtSource.onerror = () => {
    evtSource.close();
    setTimeout(startSSE, 10000);
  };
}

function updatePortfolioTable(d) {
  // 요약 카드 업데이트 (값만)
  const summaryEl = document.getElementById('portfolio-summary');
  if (summaryEl.children.length >= 3) {
    summaryEl.children[1].querySelector('.value').textContent = fmt(d.total_eval) + '원';
    summaryEl.children[2].querySelector('.value').className = 'value ' + valueClass(d.unrealized_pnl);
    summaryEl.children[2].querySelector('.value').innerHTML = fmt(d.unrealized_pnl) + '원 (' + fmtPct(d.unrealized_rate) + ')';
    if (summaryEl.children[5]) {
      summaryEl.children[5].querySelector('.value').className = 'value ' + valueClass(d.total_return);
      summaryEl.children[5].querySelector('.value').innerHTML = fmt(d.current_total) + '원 (' + fmtPct(d.total_return) + ')';
    }
  }

  // 테이블 업데이트
  const tbody = document.getElementById('portfolio-body');
  if (!d.holdings.length) return;
  tbody.innerHTML = d.holdings.map(h => `<tr>
    <td><strong>${h.stock_name}</strong><br><span style="color:var(--text2);font-size:0.75rem">${h.stock_code}</span></td>
    <td>${h.theme || '-'}</td>
    <td>${fmt(h.shares)}</td>
    <td>${fmt(h.buy_price)}</td>
    <td>${fmt(h.current_price)}</td>
    <td>${fmt(h.eval_amount)}원</td>
    <td class="${profitClass(h.profit_rate)}">${fmtPct(h.profit_rate)}</td>
    <td class="${profitClass(h.profit)}">${fmt(h.profit)}원</td>
    <td>${h.hold_days}일</td>
    <td>${badgeLvl(h.trailing_level)}${h.trailing_stop_price ? '<br><span style="font-size:0.7rem;color:var(--text2)">@'+fmt(h.trailing_stop_price)+'</span>' : ''}</td>
  </tr>`).join('');
}

// ===== 초기 로드 =====
loadPortfolio();
loadSystem();
startSSE();
</script>
</body>
</html>
