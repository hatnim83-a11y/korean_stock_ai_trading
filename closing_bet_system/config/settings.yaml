# 종가베팅 시스템 설정
# Phase별로 점진적 활성화. 변경 시 docs/improvements/change_log.md 갱신.

# ─── 자금 운용 (PRD 3-2 + Strategy-Coder P0-1 + 동적 분리 2026-05-23) ──────
fund:
  capital_ratio: 0.10              # 종가베팅 전용 자금 비중 (기본 10%)
  max_position_per_stock: 0.25     # 1종목 최대 비중 (absorb_swing_idle 활성 시 unused)
  max_concurrent_positions: 2      # 2026-06-04 축소 (4→2): 7영업일 phase1 top4 후보 단가 분포 분석 결과 64%가 200k+ 대형주 → quantity=0 price_cap 자동 거부. 종목당 한도를 199k→398k(DANGER)로 2배 확대해 매수 가능 비중 36→61% 회복. 분산 효과는 소폭 감소 (4→2)
  max_daily_entries: 2             # 2026-06-04: max_concurrent_positions=2와 정합 동기화 (4→2)
  weekly_loss_limit: -0.10         # 2026-06-01 완화 (-0.05→-0.10): 5/26 손실 -8.25%는 단순 % 합산 과대측정(가중 실제 -3.64%, 계좌 임팩트 -0.07%) → 한도 -5%로 6/1 진입 차단 발생. 계좌 9.3M 기준 -10% = 손실액 -930k 수준 한도, 실손실 보호 유지
  # ─── 동적 자본 분리 (2026-05-23 도입) ───
  absorb_swing_idle: true          # 스윙 유휴자본 흡수 토글 (false 시 base 10%만 사용)
  swing_capital_ratio: 0.9         # 스윙 풀 비율 (총자본 × 0.9) — main.py SWING_CAPITAL_RATIO env와 동기화 유지
  closing_bet_pool_cap: 0.5        # 종가베팅 풀 최대 cap (총자본 × 0.5)
  swing_used_source: "cost_basis"  # 'cost_basis'(SUM qty×buy_price) | 'evaluation'(position_state JOIN)
  # ─── 위기 시 부분 흡수 (2026-05-29 도입, docs/improvements/20260529_closing_bet_capital_limit_crisis_policy.md) ───
  disable_absorb_on_crisis: false  # 5/27 사건(phase1 4건 전원 price_cap) 대응 — false 로 풀어 위기 시에도 swing_idle 부분 흡수 허용
  crisis_absorb_ratio: 0.5         # external_risk_active 시 swing_idle × 0.5 만 흡수 (보수성 유지)

# ─── 점수 임계값 (PRD 6-1 + P2-6) ─────────────────────────────────────────
# 점수 체계: PRD 6-1 단순 카운트, 만점 11점 (Layer1 4 + Layer2 4 + Layer3 3)
# weight 의도: 각 Layer의 raw 카운트 점수에 곱하는 multiplier (정규화 X, 그대로 합산)
#   - layer1_weight=0.0 → Layer 1 4점이 0점 처리 (P2-6: 첫 2~3주 비활성)
#   - 만점이 weight 변경에 따라 달라짐: 현재는 0+4+3=7점이 사실상 만점
#   - 임계값(min_alert=7 등)은 weight=1.0 기준 11점 만점에 맞춰 설계됨 → Layer 1 활성화 시점 재검토 필요
score:
  layer1_weight: 0.0               # P2-6: 첫 2~3주 Layer 1 가중치 0 (수급 신뢰도 베이스라인 부재)
  layer2_weight: 1.0
  layer3_weight: 1.0
  score_max_full: 11               # 모든 Layer 활성화 시 만점
  score_max_phase1: 7              # Phase 1 초기(Layer1=0) 사실상 만점
  min_alert: 4                     # 2026-06-02 완화 (7→4): Layer1=0이라 사실상 만점 7점인데 min_alert=7은 만점 도달 후보만 알림 → 6/2 21건 모두 score≤4로 알림 0건 ("매수 시그널 없음" 체감). 4점(중상위)부터 알림으로 가시성 회복. 단 자동 진입은 별도 entry_executor.score_threshold(2/3) 적용
  min_entry: 8                     # 8점 이상 진입 가능 (Layer1 활성화 후 기준)
  max_position_score: 9            # 9점 이상 + 시장 양호 시 최대 비중

# ─── 의사결정 게이트 (이중 게이트, P0-2) ──────────────────────────────────
gate:
  operational_review: 30                    # 운영 점검 게이트 (통계 결론 X, 운영 흐름 점검)
  operational_min_business_days: 15         # 30건 + 최소 15영업일 경과
  operational_min_distinct_stocks: 20       # 30건 중 서로 다른 종목 20개 이상
  auto_decision: 100                        # 자동화 의사결정 게이트 (Phase 3 진입 결정)
  auto_decision_min_ev: 0.005               # EV ≥ 0.5%
  auto_decision_min_win_loss_ratio: 1.3     # 평균 익절 / 평균 손실 ≥ 1.3
  auto_decision_min_sharpe: 1.0             # 월간 샤프 ≥ 1.0

# ─── 거래비용 (PRD 7-1) ────────────────────────────────────────────────────
# 주의: 증권거래세는 매년 인하 추세 (2024 0.18% 기준). 매년 4월 정부 발표 확인 필요.
cost:
  buy_commission: 0.00015          # 0.015% (키움/한투 기준)
  sell_commission: 0.00015         # 0.015%
  transaction_tax: 0.0018          # 0.18% (2024 코스피/코스닥, 농특세 0.15% 포함). 매년 갱신 필요.
  estimated_slippage: 0.001        # 편도 0.1% (왕복 0.2%) 기본
  safety_margin: 0.005             # 안전마진 0.5%
  # 목표 세전 수익률: 약 +1.2% (코스피 최소), +1.4% (코스닥 최소)

# ─── 스케줄 (PRD 16-3 + P2-7 매도 09:30 이후) ──────────────────────────────
schedule:
  pre_check: "13:30"               # 미국선물/환율/이벤트/시장레짐 기록
  layer3_extract: "14:00"          # 테마/모멘텀 후보 수집
  layer1_first: "14:30"            # 수급 우위 1차 추출
  layer1_2_combined: "15:00"       # 수급 + 가격/거래량 통합
  external_risk: "15:10"           # DART/KIND/미국선물 통합 필터
  alert_send: "15:15"              # Telegram 알림 발송
  entry_phase1_start: "15:18"      # 정규장 1차 진입 (50%)
  entry_phase1_end: "15:19"
  entry_phase2_start: "15:25"      # 동시호가 2차 진입 (50%)
  entry_phase2_end: "15:28"
  market_close: "15:30"            # 마감 후 처리
  dart_evening_start: "15:35"      # 장 마감 후 DART 모니터링
  dart_evening_end: "16:00"
  us_market_check: "22:00"         # 미국장 모니터링
  morning_exit_start: "09:02"      # 2026-05-26: P2-7 09:30 → 09:02. EARLY_BUY_ENABLED=True 시 스윙 매수 09:05 직전 매도로 자금 환원 (KIS ord_psbl_cash 즉시 가산)
  morning_exit_force_close: "10:30"  # 강제 청산 시한
  emergency_stop_start: "09:01"    # 단위 2-5d (2026-05-16): 09:00 → 09:01 (메인 봇 monitoring_start_early + midweek_sell_profit race 회피)
  next_day_label: "10:00"          # KRX 확정 수급 수집 + 라벨링

# ─── 매도 액션 매트릭스 (PRD 10-1) ─────────────────────────────────────────
exit:
  gap_up_high_threshold: 0.02      # 시가 +2% 이상 → 즉시 50~70% 매도
  gap_up_high_partial_ratio: 0.6   # 갭업 시 1차 매도 비율
  gap_up_low_threshold: 0.005      # 시가 +0.5% ~ +2% 구간 하한
  flat_lower: -0.005               # 보합 하단
  flat_upper: 0.005                # 보합 상단
  weak_gap_down_threshold: -0.005  # 시가 -0.5% ~ -1% 약갭다운
  hard_stop_loss: -0.01            # 시가 -1% 이하 → 즉시 전량 손절 (예외적 09:00 시작)
  trailing_stop_pct: -0.015        # 강세 + 거래대금 폭발 시 -1.5% trailing

# ─── 외부 리스크 필터 (PRD 4-2/4-3) ────────────────────────────────────────
external_risk:
  us_futures_skip_threshold: -0.015        # 미국 선물 -1.5% 이하 → 당일 전체 매매 중지
  us_futures_reduce_threshold: -0.010      # 미국 선물 -1.0% ~ -1.5% → 50% 비중
  usd_krw_alert_threshold: 0.015           # USD/KRW +1.5% 이상 급등 → 50% 비중
  kospi_alert_threshold: -0.02             # 코스피 -2% 이상 하락 → 50% 비중
  vkospi_skip_threshold: 30                # V-KOSPI 30 이상 → 매매 중지

# ─── 유동성 필터 (PRD 4-4) ────────────────────────────────────────────────
liquidity:
  min_avg_value_20d: 5000000000            # 20일 평균 거래대금 50억 미만 제외
  min_today_value: 10000000000             # 당일 거래대금 100억 미만 제외
  spread_multiplier_limit: 1.5             # 호가 스프레드 20일 평균의 1.5배 초과 제외
  order_value_pct_limit: 0.03              # 주문금액이 최근 20분 거래대금의 3% 초과 제외

# ─── 종목 속성 제외 필터 (PRD 4-1) ────────────────────────────────────────
stock_filter:
  min_market_cap: 50000000000              # 시가총액 500억 미만 제외 (보조 필터)
  min_price: 1000                          # 주가 1,000원 미만 제외
  max_drop_from_52w_high: 0.30             # 52주 고점 대비 -30% 초과 하락 제외
  exclude_upper_limit: true                # 당일 상한가 종목 제외
  protection_period_days: 7                # 보호예수 해제 D-7 이내 종목 제외
  # ─ 단위 2-9f (2026-05-07) — ETF/우선주 차단 토글 ─
  # Step 0.3 검증: KOSPI top 30 ETF 13/30(43%) + 우선주 false positive 0건
  # ETF: 종목명 brand prefix 매칭 (KODEX/TIGER/KOSEF 등 + ETN 키워드)
  # 우선주: 끝자리 5/7/9 + 종목명 "우/우B/우C/우K" AND 조건 (false positive 0 검증)
  etf_block_enabled: true                  # ETF/ETN 차단 활성 (Step 0.3 정확도 100%)
  pref_stock_block_enabled: false          # 우선주 차단 점진 활성 (1주 관찰 후 true 전환 권장)

# ─── 데이터 소스 폴백 + KIS Open API ranking (단위 2-9c + 2-9d + 2-9e) ──
# 단위 2-9c: KRX 사이트 정책 변경으로 pykrx get_market_*_by_ticker(시장 단위 bulk)가
#           빈 응답을 반환할 때, 종목별 get_market_ohlcv_by_date 호출로 폴백.
# 단위 2-9d: KIS Open API ranking 4종(volume-rank/fluctuation/foreign-institution-total/market-cap)
#           로 출처 2~4 + 시총 보강(옵션 B 자연 활성). pykrx 의존도 제거.
# 단위 2-9e: KIS stck_avls 단위 = 억원 확정 (사전 조사 5종목 검증, 005930 등 stck_avls × 1억 =
#           inquire-price market_cap 정확 일치) → fallback_include_market_cap 활성화.
#           kis_market_provider.py 에서 int(round(mcap * 100_000_000)) 정규화 적용.
# 매뉴얼 출처:
#   - https://github.com/koreainvestment/open-trading-api
#   - https://apiportal.koreainvestment.com/apiservice-apiservice
data_source:
  fallback_per_ticker_enabled: true        # 2-9c: bulk 빈 응답 시 종목별 by_date 폴백 (default true)
  use_kis_ranking: true                    # 2-9d: 출처 2~4 KIS Open API 라우팅 (default true, false 시 pykrx 폴백)
  fallback_include_market_cap: true        # 2-9e: stck_avls 단위 = 억원 확정 후 활성화 (false → true). 옵션 A 보수 탈락 다수를 universe 진입시켜 universe ≥ 5건 목표
  kis_market_cap_top_n: 200                # 2-9d: KIS market-cap ranking 호출 상위 N (단위 2-9e 활성 시 사용)
  # ─ 단위 2-9f (2026-05-07) — 시총 보강 우선순위 + KIS native filter ─
  # 시총 보강: 1순위 stck_avls × 1억 (top 200) → 2순위 lstn_stcn × stck_prpr (volume_rank top 30, 미매치 종목)
  # Step 0.4 검증: 두 방식 차이 ≈ 0% (자기주식 영향 무시 가능)
  kis_market_cap_priority: false           # default false — pykrx bulk 정상 시 KRX 공식 사용 (해석 A: 미매치 종목 보강만)
  kis_div_cls_code: "0"                    # Step 0.2 — volume_rank만 "1" 활성 가능 (별도 후속 단위 2-9g)

# ─── 텔레그램 (신규 봇, env 변수 분리) ─────────────────────────────────────
telegram:
  bot_token_env: "CLOSING_BET_TELEGRAM_BOT_TOKEN"
  chat_id_env: "CLOSING_BET_TELEGRAM_CHAT_ID"

# ─── DB ──────────────────────────────────────────────────────────────────
db:
  path: "data/closing_bet.db"              # 종가베팅 전용 DB (별도 파일)
  swing_db_path: "data/trading.db"         # 스윙 DB (read-only 조회: 보유 종목 중복 방지)

# ─── KIS API ─────────────────────────────────────────────────────────────
# 단위 2-9d (2026-05-06): use_mock false 전환
#   - 배경: 메인 봇이 실전 모드(--real)라 KISApi._shared_token 이 실전 토큰. 종가베팅이
#     is_mock=true 로 모의 도메인 호출 시 토큰 인증 불일치로 403 Forbidden 발생.
#   - 영향: 종가베팅 시세 조회(orderbook/market_data/label/name_lookup) + KIS ranking
#     모두 실전 도메인 사용. Phase 1 알림형이라 자동매수 차단 → 자동매매 위험 0.
#   - Phase 2 자동매매 진입 시 재검토 필요 (모의 분리 vs 실전 통합).
kis:
  use_mock: false                          # Phase 1 알림형 — 실전 도메인 시세 조회 (자동매수 X)

# ─── EntryExecutor (단위 2-4c~f, Phase 2 자동매매 진입) ──────────────────
# 5/14 walkforward 게이트 PASS (n=103, realistic EV +1.04% / Sharpe +1.57) 후 도입.
# 활성화 절차:
#   1. 단위 2-4e dry_run 통합 단발 검증 (enabled=true / dry_run=true)
#   2. 단위 2-5 morning_exit_manager 완료 또는 수동 매도 SOP 확정
#   3. 사용자 승인 → dry_run=false / enabled=true → systemctl restart
#   4. 1주 모니터링 (옵션 C 3점 비교 + weekly_loss_limit)
# 가격 임계값(vwap_premium 등)은 EntryExecutorSettings dataclass 박제 — 백테스트 정합.
entry_executor:
  enabled: true                            # 5/15 dry_run 부분 활성화 → 5/23 실발주 전환 완료
  dry_run: false                           # 5/23 실발주 활성화 완료. 롤백: true + restart
  score_threshold: 2                       # 진입 임계 NORMAL: total_score ≥ 2 (5/14 사용자 결정)
  score_threshold_crisis: 3                # 진입 임계 CAUTION/DANGER: total_score ≥ 3 (2026-05-29 신규, 위기 시 선별 강화 — docs/improvements/20260529_closing_bet_capital_limit_crisis_policy.md)
  position_ratio: 0.7                      # PRD 기본 한도 × 0.7 (5/14 사용자 결정)
  phase1_ratio: 1.0                        # 2026-06-04: 0.5→1.0 (phase2 폐지). max_concurrent 4→2와 동시 적용으로 종목당 한도 199k→798k(DANGER)로 4배 확대. PRD 9-1 2분할 정합 위반이지만 진입률 1.5% 회복 우선
  phase2_enabled: false                    # 2026-06-04: true→false (phase1_ratio=1.0이라 phase2 무의미). 롤백 시 phase1_ratio=0.5와 함께 원복
  polling_interval_sec: 5                  # fill_checker 폴링 간격 (Step 0 결과 따라 10초 완화 가능)
  fill_check_deadline_sec: 300             # 5분 cut (15:23 또는 15:30까지)
  fallback_to_next_candidate: true         # PRD 9-2 정합 (미체결 시 다음 후보)
  market_guard_enabled: true               # Phase 0.5 시장 위기 검사 (CRISIS/DANGER/CAUTION)

# ─── ExitExecutor (단위 2-5c~f, Phase 2 자동매도) ─────────────────────────
# 단위 2-4 자동매수 익일 09:01~10:30 PRD 10-1 시가 액션 매트릭스 5단계 자동매도.
# trailing_stop은 단위 2-5g 별도 분리 (09:02~10:30 폴링 루프 필요).
# 2026-05-26: morning_exit 09:30 → 09:02 (스윙 09:05 매수 직전 자금 환원)
# 활성화 절차:
#   1. 단위 2-5e dry_run 통합 단발 검증 (enabled=true / dry_run=true)
#   2. 단위 2-4f entry_executor.dry_run=false 와 묶어서 단발 활성화 권장
#   3. 사용자 명시 승인 → dry_run=false / enabled=true → systemctl restart
#   4. 1주 모니터링 (시뮬 정합성 + weekly_loss_limit)
# PRD 10-1 박제값(exit.*)은 ExitExecutorSettings frozen dataclass 박제 — 백테스트 정합.
morning_exit:
  enabled: true                            # 5/16 dry_run 부분 활성화 → 5/23 실매도 전환 완료
  dry_run: false                           # 5/23 실매도 활성화 완료. 롤백: true + restart
  emergency_stop_enabled: true             # 09:01 emergency_stop 분기 활성 (false면 09:02 morning_exit에 위임)
  use_sell_lock: true                      # 메인 봇 sell_lock 재사용 + owner 네임스페이스 'closing_bet:*'
  polling_interval_sec: 5                  # fill_checker 폴링 간격
  fill_check_deadline_sec: 60              # 시장가 매도는 빠름, 1분 cut
  cancel_confirm_deadline_sec: 30          # P1-4 force_close 미체결 취소 확인 대기

# ─── Kill Switch (Phase 3에서 활성화) ────────────────────────────────────
kill_switch:
  enabled: false                           # Phase 3에서 true로 전환
  api_response_timeout_sec: 5              # 5초 이상 응답 → 추가 진입 중단
  api_error_rate_window_min: 10            # 10분 윈도우
  api_error_rate_threshold: 0.05           # 5% 이상 → 모든 신규 주문 중단
  daily_loss_threshold: -0.03              # 일일 -3% → 추가 진입 금지
  telegram_silence_threshold_min: 30       # 30분 무응답 → 시스템 자체 중단
